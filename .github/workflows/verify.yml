# FRED's first CI. Boots an ephemeral, offline backend under the Spring `ci`
# profile (externals guarded by @Profile("!ci"); test users seeded by
# CiSeedConfig), then runs the real Phase 2 API contract suite, a frontend
# type-check, and a scoped frontend unit spec. Gates every PR into `develop`,
# and squash-merges the itpm routine's verify/* PRs when green.
name: verify

on:
  pull_request:
    branches: [develop]

# The final step squash-merges routine PRs; verification steps only need read.
permissions:
  contents: write
  pull-requests: write

jobs:
  # Job/check name is referenced verbatim by branch protection on `develop`
  # (Task 8) — do not rename without updating the required status check.
  backend-frontend:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        # The committed application-ci.properties already points the `ci`
        # datasource at 127.0.0.1:3306/fred with user root / password ci,
        # so no DB env override is needed in the backend boot step.
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: fred
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      # Java 17 — backend/build.gradle toolchain: JavaLanguageVersion.of(17)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Node 22 — no .nvmrc/engines pin in the repo; 22 LTS is the version
      # Angular CLI ^19.2.x officially supports.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pin npm to the node-22 default (DEV-198) so package-lock.json stays
      # byte-identical across the routine sandbox, CI, and local — no libc churn.
      - name: Pin npm version
        run: npm install -g npm@10.9.7

      - name: Boot backend (ci profile)
        working-directory: backend
        run: |
          SPRING_PROFILES_ACTIVE=ci ./gradlew bootRun > /tmp/boot.log 2>&1 &
          # Readiness probe: GET /hello is the app's permitAll health endpoint
          # (HealthCheckController). The backend has no spring-boot-actuator
          # dependency, so /actuator/health would 404 — /hello is the correct,
          # dependency-free signal that the context is up.
          for i in $(seq 1 90); do
            curl -sf localhost:8080/hello && break
            sleep 2
          done
          curl -sf localhost:8080/hello || { echo "backend failed to boot"; tail -80 /tmp/boot.log; exit 1; }

      - name: Phase 2 — API contract
        run: |
          # test/api/lib/auth.sh sources config.local.sh (gitignored, absent in
          # CI), then authenticates against $BASE_URL via
          # /api/dev/authenticate-as-user and exports $TOKEN. It uses the
          # dev-auth endpoint — NOT real passkey — so the only thing CI must
          # provide is this config pointing at the local backend with a seeded
          # email (facebook@gmail.com is seeded by CiSeedConfig under `ci`).
          # This is the CI equivalent of config.example.sh, retargeted at the
          # local backend (config.local.sh itself is gitignored).
          cat > test/api/config.local.sh <<'EOF'
          #!/bin/bash
          export TEST_USER_EMAIL="facebook@gmail.com"
          export BASE_URL="http://localhost:8080"
          EOF
          bash test/api/run-all.sh

      - name: Frontend — install + tsc + lint + scoped unit
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx tsc --noEmit
          # Lint is a gate now, not decoration: the no-restricted-imports rule that keeps
          # posthog-js inside services/analytics/posthog.adapter.ts only protects anything
          # if a red lint fails the build. The four pre-existing errors were fixed when it
          # was switched on, so this starts green.
          npx ng lint
          # And prove the rule itself fires — a lint rule nobody tests is a comment.
          npm run test:lint-rule
          # Scoped on purpose: the full `ng test` fails on FRED's bit-rotted
          # legacy CLI-generated component specs. jwt-token.utils.spec.ts is
          # proven green and confirms the karma/ChromeHeadless runner works.
          # TODO: select the per-story specs by diff in a later iteration
          # (the verifier already runs `ng test --include=<changed>.spec.ts`).
          npx ng test --include='**/jwt-token.utils.spec.ts' --watch=false --browsers=ChromeHeadless
          # Analytics specs: these are new and green, so they are gated from the start.
          npx ng test --include='**/services/analytics/*.spec.ts' --include='**/dev-tools-key.utils.spec.ts' --watch=false --browsers=ChromeHeadless

      # Design-fidelity gate: render the changed route + calibration refs in a headless
      # mobile browser, then a Claude-vision judge compares the render to the approved
      # mockup. Runs only on routine PRs that captured a design-ref. A fail turns the job
      # red → no auto-merge → the routine's fix-loop gets the drift notes. With no
      # ANTHROPIC_API_KEY set it SKIPS (warns) so the routine is never blocked before the
      # secret is added; once the secret exists the gate enforces automatically.
      - name: Design-fidelity (render + vision judge)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'verify/')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          STORY="${GITHUB_HEAD_REF#verify/}"
          MOCKUP=$(ls "ITPM/verify/design-ref/$STORY".* 2>/dev/null | head -1 || true)
          if [ -z "$MOCKUP" ]; then echo "no design-ref for $STORY — skipping design-fidelity"; exit 0; fi
          ROUTE=$(cat "ITPM/verify/route-$STORY.txt" 2>/dev/null || true)
          if [ -z "$ROUTE" ]; then echo "no route-$STORY.txt — skipping design-fidelity"; exit 0; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY not set — skipping design-fidelity (add the repo secret to enable the gate)"; exit 0; fi

          cd frontend
          npx ng build --configuration=ci
          npx serve www -l 4200 >/tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4200 >/dev/null && break; sleep 1; done
          curl -sf http://localhost:4200 >/dev/null || { echo "serve failed"; cat /tmp/serve.log; exit 1; }
          npx playwright install --with-deps chromium
          mkdir -p /tmp/shots

          # mockup → png if it's HTML
          MOCKUP_PNG="../$MOCKUP"
          case "$MOCKUP" in *.html) node scripts/visual/render-file.mjs "../$MOCKUP" /tmp/shots/mockup.png; MOCKUP_PNG=/tmp/shots/mockup.png;; esac

          # calibration references + the story route
          SETTINGS_ROUTE=$(node -e "console.log(require('./scripts/visual/refs.json').calibration[1].route)")
          node scripts/visual/render.mjs http://localhost:4200 /tabs/tab3 /tmp/shots/ref-tab3.png
          node scripts/visual/render.mjs http://localhost:4200 "$SETTINGS_ROUTE" /tmp/shots/ref-settings.png
          node scripts/visual/render.mjs http://localhost:4200 "$ROUTE" /tmp/shots/render.png

          # pass Andrew's per-selection design feedback (if any) so the judge treats the mockup as amended
          NOTES_ARG=""
          [ -f "../ITPM/verify/design-notes-$STORY.txt" ] && NOTES_ARG="--notes=../ITPM/verify/design-notes-$STORY.txt"
          node scripts/visual/design-judge.mjs \
            --render=/tmp/shots/render.png \
            --mockup="$MOCKUP_PNG" \
            $NOTES_ARG \
            --ref=/tmp/shots/ref-tab3.png \
            --ref=/tmp/shots/ref-settings.png

      - name: Upload render artifacts
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'verify/')
        uses: actions/upload-artifact@v4
        with:
          name: design-render-shots
          path: /tmp/shots/
          if-no-files-found: ignore

      # Squash-merge the routine's verify/<story> PR to develop once everything
      # above is green. Runs ONLY for verify/* PRs (the itpm routine) — a PR you
      # open yourself is NOT auto-merged. This step only executes if every
      # verification step above succeeded.
      - name: Auto-merge routine PR on green
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'verify/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
