plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.investingapp'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-rest'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'com.plaid:plaid-java:46.0.0'
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
	implementation 'com.anthropic:anthropic-java:2.48.0' // Claude chat (Ask FRED); OpenAI kept for embeddings
	implementation 'com.yubico:webauthn-server-core:2.7.0' // Check for the latest version
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8' // For Java 8 Optional support
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310' // For Java 8 time types (LocalDate, LocalDateTime, etc.)
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5' // Or latest 0.11.x or 0.12.x if available and compatible
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'  // Choose one implementation
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // For Jackson JSON processing with JWTs
	implementation 'org.apache.httpcomponents.client5:httpclient5' // Required for RestTemplate PATCH support
	implementation 'org.springframework:spring-webflux' // For WebClient / AI token streaming
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.mysql:mysql-connector-j'

	// Schema is owned by versioned migrations (db/migration), not ddl-auto. flyway-mysql carries
	// the MySQL support that Flyway 10+ splits out of core.
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'io.pinecone:pinecone-client:3.0.0' // Pinecone Client
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-Xlint:deprecation']
}

tasks.named('test') {
	useJUnitPlatform()
}
