# =============================================================================
# CI profile — offline, no-network boot for GitHub Actions PR verification.
#
# Goal: the Spring context starts with NO internet access. Every external
# integration (Pinecone, Plaid, Alpaca, OpenAI, Persona) is either guarded out
# of the context by @Profile("!ci") (see config/*Config.java + CiStubConfig)
# or pointed at a dead localhost port so any lazy call fails fast instead of
# reaching a real/prod endpoint.
#
# The datasource below targets the GitHub Actions MySQL *service container*
# (image: mysql:8.0, MYSQL_ROOT_PASSWORD=ci, MYSQL_DATABASE=fred). For local
# validation, override SPRING_DATASOURCE_URL/USERNAME/PASSWORD via env vars to
# point at a throwaway local schema (never touch investing_dev).
# =============================================================================

# --- Datasource: CI MySQL service container ----------------------------------
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/fred?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=ci
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Scheduler: disabled in CI -----------------------------------------------
# (Schedulers are also cron/time-gated, so they would not fire during a short
#  CI window; this key mirrors application.properties intent.)
investment.scheduler.enabled=false

# --- JWT: deterministic CI secret so dev-auth tokens validate ----------------
# 64+ chars (>= 32 bytes for HS256). CI-only — never used in prod.
jwt.secret=ci-only-deterministic-secret-do-not-use-in-prod-0123456789abcdef
jwt.expiration.ms=3600000

# --- External integrations: dead local port / disabled -----------------------
# Pinecone + OpenAI: the @Profile("!ci") guards keep the boot-time beans out of
# the CI context (a ci stub Pinecone bean is provided for wiring). These values
# only satisfy @Value resolution; no client reaches the network at boot.
openai.api-key=ci-disabled
pinecone.api-key=ci-disabled
pinecone.index-name=ci-disabled

# Plaid: PlaidConfig is @Profile("!ci"); a ci stub PlaidApi bean is provided.
# These values keep PlaidService @Value injections resolvable.
plaid.client.id=ci-disabled
plaid.client.name=FRED (CI)
plaid.secret=ci-disabled
plaid.env=sandbox

# Alpaca: clients are constructed lazily (no boot-time network). Point base-urls
# at a dead local port so any accidental call fails fast instead of hitting prod.
alpaca.api.key=ci-disabled
alpaca.api.secret=ci-disabled
alpaca.market.key=ci-disabled
alpaca.market.secret=ci-disabled
alpaca.broker.base-url=http://127.0.0.1:9
alpaca.trading.base-url=http://127.0.0.1:9
alpaca.market.base-url=http://127.0.0.1:9

# Persona: no boot-time bean; dummy values for any lazy @Value resolution.
persona.api.key=ci-disabled
persona.api.base-url=http://127.0.0.1:9

# --- Encryption: valid AES-128 (16-byte) key for CI --------------------------
encryption.secret-key=ci-disabled-key1

# --- WebAuthn relying party: local-style values (no network at boot) ---------
webauthn.relyingparty.id=localhost
webauthn.relyingparty.name=FRED (CI)
webauthn.relyingparty.origins=http://localhost:8080,http://localhost:8100,http://localhost

# --- Email: disabled in CI ---------------------------------------------------
app.email.enabled=false

# --- Tax Loss Harvesting: off in CI ---
app.tlh.mode=off
