# ===================================================================
# Spring Boot application configuration for the 'dev' environment
# Deployed on Railway from the 'main' branch
# Nuclear Option: Build JDBC URL from individual Railway environment variables
# ===================================================================

# Database Configuration - Nuclear Option
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# --- JPA / Hibernate Configuration ---
# Use 'create-drop' to force table creation and debugging
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false

# --- Jackson JSON Configuration ---
# Ensure dates are parsed consistently and don't shift due to timezone issues
spring.jackson.date-format=yyyy-MM-dd

# --- WebAuthn / Passkey Configuration ---
# These should point to your public-facing DEV domain for the frontend/app origin.
# The values will be supplied by Railway environment variables.
webauthn.relyingparty.id=${WEBAUTHN_RP_ID_DEV}
webauthn.relyingparty.name=FRED (Dev)
webauthn.relyingparty.origins=${WEBAUTHN_RP_ORIGINS_DEV}

# --- Plaid Configuration ---
# These values will be supplied by Railway environment variables.
plaid.client.id=${PLAID_CLIENT_ID}
plaid.client.name=FRED (DEV)
plaid.secret=${PLAID_SECRET_SANDBOX}
plaid.env=sandbox

# --- Security & JWT Configuration ---
# These values will be supplied by Railway environment variables.
jwt.secret=${JWT_SECRET_DEV}
encryption.secret-key=${ENCRYPTION_SECRET_KEY_DEV}

# Jackson configuration for Java 8 Optional support
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non-null
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.mapper.require-handlers-for-java8-optionals=false

server.address=0.0.0.0

# --- Alpaca API Configuration ---
# These values will be supplied by Railway environment variables.
alpaca.api.key=${ALPACA_API_KEY}
alpaca.api.secret=${ALPACA_API_SECRET}
alpaca.market.key=${ALPACA_MARKET_DATA_KEY}
alpaca.market.secret=${ALPACA_MARKET_DATA_SECRET}
alpaca.broker.base-url=${ALPACA_API_BASE_URL}
alpaca.trading.base-url=${ALPACA_API_TRADING_URL}
alpaca.market.base-url=${ALPACA_MARKET_DATA_BASE_URL}

# --- AASA File Serving (if not using a dedicated controller) ---
# This is an alternative way to try and set content-type for the AASA file.
# A dedicated controller is often more reliable.
# spring.web.resources.media-types.well-known/apple-app-site-association=application/json

app.market-breakdown.manual-generate-enabled=true
# --- Tax Loss Harvesting: dry-run verification surface ---
app.tlh.mode=dry-run
app.tlh.manual-run-enabled=true
