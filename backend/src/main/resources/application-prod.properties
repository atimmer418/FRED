# Every variable below must be set on the prod service before the first boot:
#   DATASOURCE_URL_PROD (jdbc:mysql:// to the prod database, never localhost), MYSQLUSER,
#   MYSQLPASSWORD, JWT_SECRET_PROD (at least 64 random bytes, never the dev one),
#   ENCRYPTION_SECRET_KEY, WEBAUTHN_RP_ID_PROD, WEBAUTHN_RP_ORIGINS_PROD, and the five
#   Plaid variables documented in the Plaid block below: PLAID_CLIENT_ID, PLAID_SECRET_PRODUCTION,
#   PLAID_WEBHOOK_URL, PLAID_LINK_CUSTOMIZATION, PLAID_REDIRECT_URI.
spring.datasource.url=${DATASOURCE_URL_PROD}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

jwt.secret=${JWT_SECRET_PROD}

# --- Plaid (production) ---
# Every value comes from the environment. Set these on the prod service before the first boot:
#   PLAID_CLIENT_ID, PLAID_SECRET_PRODUCTION, PLAID_WEBHOOK_URL (public https, no tunnel),
#   PLAID_LINK_CUSTOMIZATION, PLAID_REDIRECT_URI.
# BrokerEnvironmentGuard refuses to start on plaid.env other than production, a non-https, loopback
# or tunnel webhook URL, the once-committed sandbox secret, or the ci webhook-verifier bypass bean.
plaid.client.id=${PLAID_CLIENT_ID}
plaid.secret=${PLAID_SECRET_PRODUCTION}
plaid.env=production
plaid.client.name=FRED
plaid.webhook.url=${PLAID_WEBHOOK_URL}
plaid.link.customization=${PLAID_LINK_CUSTOMIZATION}
plaid.redirect.uri=${PLAID_REDIRECT_URI}

encryption.secret-key=${ENCRYPTION_SECRET_KEY}

webauthn.relyingparty.id=${WEBAUTHN_RP_ID_PROD}
webauthn.relyingparty.name=Investing App (Dev)
webauthn.relyingparty.origins=${WEBAUTHN_RP_ORIGINS_PROD}
