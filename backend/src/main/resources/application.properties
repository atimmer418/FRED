spring.application.name=investing-app-backend
server.port=${PORT:8080}

# These are common across all environments
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HikariCP Configuration
# Set max-lifetime to 10 minutes (600000ms) to prevent using stale connections
spring.datasource.hikari.max-lifetime=600000
# Set idle-timeout to 5 minutes (300000ms) to fix "idleTimeout is close to or more than maxLifetime" warning
spring.datasource.hikari.idle-timeout=300000
# Increase connection timeout to 60s (was 30s) to allow sleeping DBs to wake up
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.minimum-idle=1
# 10, not 4: scheduler pool 6 plus the REQUIRES_NEW job-lock and batch-claim transactions (spec 5.6).
spring.datasource.hikari.maximum-pool-size=10

# jwt.expiration.ms=3600000
jwt.expiration.ms=300000

# Jackson configuration for Optional types
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Email Configuration
# --- Server-side analytics (Checkpoint E) ---
# The outbox is always written: it is our own ledger and Checkpoint G's metrics read it directly.
# Publishing to PostHog is what this flag gates, and it is OFF by default so a new environment
# never starts shipping events to a real project by accident. The key is the project's public
# ingestion key, not a secret, but it still comes from the environment so dev and prod can point
# at different projects without a rebuild. With no key the publisher throws, which leaves rows
# PENDING rather than marking them sent: a missing key must look like an outage, not a success.
app.analytics.publisher.enabled=${ANALYTICS_PUBLISHER_ENABLED:false}
app.analytics.publisher.batch-size=${ANALYTICS_BATCH_SIZE:100}
app.analytics.posthog.key=${POSTHOG_PROJECT_KEY:}
app.analytics.posthog.host=${POSTHOG_HOST:https://us.i.posthog.com}
app.analytics.posthog.timeout-ms=${POSTHOG_TIMEOUT_MS:10000}

app.email.enabled=${EMAIL_ENABLED:false}
app.email.from=${EMAIL_FROM:noreply@investingapp.com}
app.email.provider=${EMAIL_PROVIDER:logging}

# Market Breakdown (Piggy Plus monthly email)
app.market-breakdown.manual-generate-enabled=${MARKET_BREAKDOWN_MANUAL_GENERATE:false}

# Investment Execution Configuration
investment.scheduler.enabled=${INVESTMENT_SCHEDULER_ENABLED:true}
investment.min.amount=${INVESTMENT_MIN_AMOUNT:1.00}
investment.max.amount=${INVESTMENT_MAX_AMOUNT:50000.00}

# FRED Chat Configuration (Use Environment Variables in Prod/Run Config)
# Chat runs on Claude; OpenAI is kept for embeddings (RAG) only.
anthropic.api-key=${ANTHROPIC_API_KEY}
anthropic.chat-model=claude-sonnet-5
openai.api-key=${OPENAI_API_KEY}
openai.chat-model=gpt-4o
openai.embedding-model=text-embedding-3-large

pinecone.api-key=${PINECONE_API_KEY}
pinecone.index-name=${PINECONE_INDEX_NAME}

# Document upload — base64 encoding inflates file size ~33%, so 15MB covers ~10MB originals
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB


# --- Tax Loss Harvesting (Piggy Pro) -----------------------------------------
# mode binds at startup (restart to change). Emergency stop: TLH_MODE=off — no
# new orders of any kind; polling continues observe-only and wash-sale windows
# stay enforced. Graceful drain: keep live with TLH_MAX_PER_CYCLE=0 so open
# chains complete and re-entries fire. The 30-day wash window is a code
# constant on purpose (statutory, not tunable). All thresholds are global —
# rule-based, never per-user.
app.tlh.mode=${TLH_MODE:off}
app.tlh.manual-run-enabled=${TLH_MANUAL_RUN:false}
app.tlh.min-loss-dollars=${TLH_MIN_LOSS_DOLLARS:50.00}
app.tlh.min-loss-percent=${TLH_MIN_LOSS_PERCENT:5.0}
app.tlh.min-position-value=${TLH_MIN_POSITION_VALUE:100.00}
app.tlh.max-notional-per-harvest=${TLH_MAX_NOTIONAL:25000.00}
app.tlh.max-harvests-per-user-per-cycle=${TLH_MAX_PER_USER:2}
app.tlh.max-harvests-per-cycle=${TLH_MAX_PER_CYCLE:25}
app.tlh.max-users-per-cycle=${TLH_MAX_USERS:200}
app.tlh.inter-user-delay-ms=${TLH_USER_DELAY_MS:250}
app.tlh.consecutive-failure-halt=${TLH_FAILURE_HALT:5}
app.tlh.symbol-cooldown-days=${TLH_COOLDOWN_DAYS:45}
app.tlh.price-guard-buffer-percent=${TLH_PRICE_BUFFER:0.5}
app.tlh.blocked-buy-policy=${TLH_BLOCKED_BUY_POLICY:redirect}
app.tlh.drip-blocked-policy=${TLH_DRIP_POLICY:skip}
app.tlh.unmapped-fallback=${TLH_UNMAPPED_FALLBACK:skip}
app.tlh.reentry-enabled=${TLH_REENTRY_ENABLED:true}
app.tlh.replace-on-partial=${TLH_REPLACE_ON_PARTIAL:true}
app.tlh.replacement-attempts-max=${TLH_REPLACEMENT_ATTEMPTS:3}
app.tlh.estimate-tax-rate=${TLH_ESTIMATE_TAX_RATE:0.24}
app.tlh.extra-pairs=${TLH_EXTRA_PAIRS:}
app.tlh.extra-identity-groups=${TLH_EXTRA_IDENTITY:}

# --- Dev tools (/api/dev/** and simulated passkey attestation) ---------------
# The endpoints themselves only exist in the local/dev/test/ci profiles (@Profile), and
# DevToolsProdGuard refuses to start the app if they are ever registered under prod.
# This key is the second lock, because api-dev is reachable from the public internet:
# requests without a matching X-Dev-Tools-Key header get 404. An unset key denies everything.
app.dev-tools.key=${DEV_TOOLS_KEY:}

# --- Schema migrations (Flyway) ----------------------------------------------
# The schema is owned by db/migration. Hibernate only validates that the entities match what the
# migrations built (ddl-auto=validate in every profile), so a drifting entity fails at startup
# instead of silently altering a table.
# baseline-on-migrate stamps an existing database (local, Railway dev) at version 1 rather than
# running V1 against it; an empty database runs V1 normally. See FREDdocs/flyway-baseline.md.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
