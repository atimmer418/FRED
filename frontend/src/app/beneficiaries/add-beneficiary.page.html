<ion-header class="ion-no-border">
  <div class="blue-hero-header">
    <div class="hero-nav">
      <button class="back-btn" (click)="goBack()">
        <span class="material-symbols-outlined">arrow_back_ios_new</span>
      </button>
      <h2 class="header-title">{{ editMode ? 'Edit Beneficiary' : 'Add Beneficiary' }}</h2>
      <div class="back-btn-spacer"></div>
    </div>
  </div>
</ion-header>

<ion-content class="main-content" appKeyboardAvoid>
  <div class="content-inner">

    <!-- Personal Information -->
    <div class="section-card">
      <div class="card-header-row">
        <span class="material-symbols-outlined card-icon">person</span>
        <h3 class="card-title">Personal Information</h3>
      </div>

      <div class="form-group">
        <p class="field-label">Beneficiary Type<span class="required-star">*</span></p>
        <div class="select-wrapper">
          <select class="field-select" [(ngModel)]="beneficiary.beneficiaryType">
            <option value="" disabled>Select type</option>
            <option value="PRIMARY">Primary</option>
            <option value="CONTINGENT">Contingent</option>
          </select>
          <span class="select-arrow material-symbols-outlined">expand_more</span>
        </div>
      </div>

      <div class="form-group">
        <label class="field-label">First Name<span class="required-star">*</span></label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.firstName"
          placeholder="Enter first name"
          type="text"
          maxlength="100">
      </div>

      <div class="form-group">
        <label class="field-label">Last Name<span class="required-star">*</span></label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.lastName"
          placeholder="Enter last name"
          type="text"
          maxlength="100">
      </div>

      <!-- The date of birth opens the FRED date sheet, not a calendar input; the echo says the age. -->
      <div class="form-group">
        <p class="field-label">Date of Birth<span class="required-star">*</span></p>
        <button
          type="button"
          class="field-value-btn field-value-btn--date"
          aria-haspopup="dialog"
          [attr.aria-label]="dobAriaLabel"
          (click)="openDateOfBirth()">
          @if (beneficiary.dateOfBirth) {
            <span>{{ dobLabel }}</span>
          } @else {
            <span class="field-placeholder">Select date</span>
          }
          <span class="material-symbols-outlined" aria-hidden="true">calendar_month</span>
        </button>
        <p class="field-echo" [class.field-echo--empty]="!beneficiary.dateOfBirth">
          <span class="material-symbols-outlined" aria-hidden="true">cake</span>
          <span>{{ dobEcho }}</span>
        </p>
      </div>

      <div class="form-group">
        <label class="field-label">Social Security Number<span class="required-star">*</span></label>
        <input
          class="field-input"
          [value]="beneficiary.socialSecurityNumber || ''"
          placeholder="XXX-XX-XXXX"
          type="text"
          inputmode="numeric"
          maxlength="11"
          (input)="formatSSN($event)">
      </div>

      <div class="form-group">
        <p class="field-label">Relationship<span class="required-star">*</span></p>
        <div class="select-wrapper">
          <select class="field-select" [(ngModel)]="beneficiary.relationship">
            <option value="" disabled>Select relationship</option>
            <option *ngFor="let option of relationshipOptions" [value]="option.value">{{ option.label }}</option>
          </select>
          <span class="select-arrow material-symbols-outlined">expand_more</span>
        </div>
      </div>

      <!-- The allocation opens the slide tray, not the keyboard: the tray grows right under this row. -->
      <div class="form-group form-group--last">
        <div class="field-label-row">
          <label class="field-label" [class.active]="tray.isOpen('allocation')">
            {{ tray.label('allocation') }}@if (!tray.showsStep('allocation')) {<span class="required-star">*</span>}
          </label>
          @if (tray.shown()) {
            <button type="button" class="field-tray-done" (click)="tray.close()">Done</button>
          }
        </div>
        <button
          type="button"
          class="field-value-btn"
          [class.active]="tray.isOpen('allocation')"
          [attr.aria-expanded]="tray.isOpen('allocation')"
          (click)="tray.toggle('allocation')">
          @if (beneficiary.percentageAllocation) {
            {{ beneficiary.percentageAllocation | number:'1.0-2' }}
          } @else {
            <span class="field-placeholder">0</span>
          }
          <span class="field-affix">%</span>
        </button>
        @if (tray.shown()) {
          <app-amount-tray-slot [tray]="tray" />
        }
      </div>
    </div>

    <!-- Contact Information -->
    <div class="section-card">
      <div class="card-header-row">
        <span class="material-symbols-outlined card-icon">mail</span>
        <h3 class="card-title">Contact Information</h3>
      </div>

      <div class="form-group">
        <label class="field-label">Email</label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.email"
          placeholder="email@example.com"
          type="email"
          maxlength="255">
      </div>

      <div class="form-group form-group--last">
        <label class="field-label">Phone Number</label>
        <input
          class="field-input"
          [value]="beneficiary.phone || ''"
          placeholder="(555) 123-4567"
          type="tel"
          maxlength="14"
          (input)="formatPhone($event)">
      </div>
    </div>

    <!-- Address Information -->
    <div class="section-card">
      <div class="card-header-row">
        <span class="material-symbols-outlined card-icon">location_on</span>
        <h3 class="card-title">Address Information</h3>
      </div>

      <div class="form-group">
        <label class="field-label">Address Line 1</label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.addressLine1"
          placeholder="123 Main Street"
          type="text"
          maxlength="255">
      </div>

      <div class="form-group">
        <label class="field-label">Address Line 2</label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.addressLine2"
          placeholder="Apt 123"
          type="text"
          maxlength="255">
      </div>

      <div class="form-group">
        <label class="field-label">City</label>
        <input
          class="field-input"
          [(ngModel)]="beneficiary.city"
          placeholder="New York"
          type="text"
          maxlength="100">
      </div>

      <div class="form-row">
        <div class="form-group form-group--last">
          <label class="field-label">State</label>
          <input
            class="field-input"
            [(ngModel)]="beneficiary.state"
            placeholder="NY"
            type="text"
            maxlength="2">
        </div>
        <div class="form-group form-group--last">
          <label class="field-label">ZIP Code</label>
          <input
            class="field-input"
            [(ngModel)]="beneficiary.postalCode"
            placeholder="12345"
            type="text"
            inputmode="numeric"
            maxlength="10">
        </div>
      </div>
    </div>

    <!-- Save -->
    <button class="cta-btn" (click)="onSave()" [disabled]="isLoading || !isFormComplete">
      <span class="material-symbols-outlined">save</span>
      {{ editMode ? 'Update Beneficiary' : 'Add Beneficiary' }}
    </button>

  </div>
</ion-content>
