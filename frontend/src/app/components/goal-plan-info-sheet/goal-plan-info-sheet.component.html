<div class="pi-body">
  <div class="pi-handle"></div>
  <h3>How FRED plans this</h3>
  <p class="pi-sub">The same three notes for every unit of the family plan.</p>

  <div class="pi-notes">
    @for (n of notes; track $index) {
      <div class="fd-how">
        <span class="material-symbols-outlined">{{ n.icon }}</span>
        <p><b>{{ n.lead }}</b> {{ n.text }}</p>
      </div>
    }
  </div>

  <button type="button" class="pi-done" (click)="close()">Done</button>
</div>
