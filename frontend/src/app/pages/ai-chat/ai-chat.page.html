<ion-menu #chatMenu contentId="main-content" side="end" menuId="chat-menu" [swipeGesture]="false">
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-title>History</ion-title>
      <ion-buttons slot="end">
        <ion-menu-toggle menu="chat-menu" auto-hide="false">
          <ion-button class="new-chat-btn" (click)="startNewChat()">
            <ion-icon slot="icon-only" name="add-outline"></ion-icon>
          </ion-button>
        </ion-menu-toggle>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  <ion-content class="history-content">
    <div class="history-list">
      <ion-menu-toggle menu="chat-menu" auto-hide="false">
        <button class="history-item" *ngFor="let session of sessions" (click)="loadSession(session)"
          [class.active]="session.id === currentSession?.id">
          <span class="history-item-title">{{ session.title }}</span>
          <span class="history-item-date">{{ session.lastModified | date:'MMM d, h:mm a' }}</span>
        </button>
      </ion-menu-toggle>
      <p class="history-empty" *ngIf="sessions.length === 0">No conversations yet</p>
    </div>
  </ion-content>
</ion-menu>

<div class="ion-page" id="main-content" (pointerdown)="onPagePointerDown($event)"
  (touchmove)="onPageTouchMove($event)">
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-title>Ask FRED</ion-title>
      <ion-buttons slot="end">
        <ion-menu-button menu="chat-menu">
          <ion-icon slot="icon-only" name="menu-outline"></ion-icon>
        </ion-menu-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true" class="chat-content" appTabBarScroll tabBarNoShrink appKeyboardAvoid>
    <div class="messages-container">
      <div *ngFor="let msg of messages; let i = index" class="message-wrapper"
        [class.user-message]="msg.role === 'user'" [class.assistant-message]="msg.role === 'assistant'"
        [class.failed-message]="msg.failed" [class.empty-message]="msg.role === 'assistant' && !msg.content"
        [style.display]="isHiddenActionOutcome(i) ? 'none' : null"
        [id]="'chat-message-' + i">

        <div class="avatar" *ngIf="msg.role === 'assistant'">
          <img src="assets/images/pig-range-4.svg" class="fred-avatar-img" alt="FRED">
        </div>

        <!-- Retry button for failed messages (before bubble) -->
        <ion-button *ngIf="msg.failed && msg.role === 'user'" size="small" fill="outline" color="danger"
          (click)="retryMessage(i)" class="retry-button-inline">
          <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
        </ion-button>

        <div class="message-bubble">
          <div class="message-text" *ngIf="msg.role === 'assistant'; else userText">
            <ng-container *ngFor="let seg of segments(msg); trackBy: trackSegment">
              <div *ngIf="seg.kind === 'md'" class="md-block" [innerHTML]="seg.text | markdown"></div>
              <app-chat-chart *ngIf="seg.kind === 'chart'" [config]="seg.config"></app-chat-chart>
              <app-chat-action-card *ngIf="seg.kind === 'action'"
                [proposal]="seg.proposal" [state]="seg.state" [resultMessage]="seg.resultMessage"
                [actionable]="isActionable(msg)"
                (confirmed)="confirmAction(msg, seg)" (cancelled)="cancelAction(seg)">
              </app-chat-action-card>
              <div *ngIf="seg.kind === 'suggestions' && isLatestMessage(msg) && !isLoading" class="quick-replies">
                <div class="quick-reply" *ngFor="let option of seg.options">
                  <button class="quick-reply-text" (click)="sendQuickReply(option)">{{ option }}</button>
                  <button class="quick-reply-edit" (click)="editQuickReply(option)"
                    aria-label="Edit this reply before sending">
                    <ion-icon name="pencil-outline"></ion-icon>
                  </button>
                </div>
              </div>
            </ng-container>
          </div>
          <ng-template #userText>
            <div class="message-text user-text">{{ msg.content }}</div>
          </ng-template>
          <!-- <div class="message-time">{{ msg.timestamp | date:'shortTime' }}</div> -->
        </div>

      </div>

      <div *ngIf="isEmptyState" class="empty-state" [class.kb-hidden]="keyboardOffset > 0">
        <img src="assets/images/pig-range-4.svg" class="empty-hero" alt="FRED piggy bank" />
        <h1 class="empty-greeting">{{ timeGreeting }}</h1>
        <p class="empty-subtitle">What are we doing today?</p>

        <div class="suggestion-cards" *ngIf="dailySuggestions.length > 0">
          <button
            class="suggestion-card"
            *ngFor="let question of dailySuggestions; let i = index"
            (click)="selectSuggestion(question)"
            [attr.data-tour]="question === FRED_STORY_TRIGGER ? 'story-chip' : null">
            <span class="card-icon"><ion-icon [name]="suggestionIcon(i)"></ion-icon></span>
            <span class="card-text">{{ question }}</span>
          </button>
        </div>
      </div>

      <div *ngIf="isLoading" class="thinking-row">
        <img src="assets/images/pig-range-4.svg" class="thinking-pig" alt="" />
        <span class="thinking-text">{{ thinkingPhrase }}</span>
      </div>
      <div id="scroll-anchor" style="height: 1px; width: 100%;"></div>
    </div>
  </ion-content>

  <ion-footer class="ion-no-border" [class.kb-open]="keyboardOffset > 0" [style.--kb-offset.px]="keyboardOffset">
    <div class="input-bar">
      <div class="input-container">
        <ion-textarea [(ngModel)]="newMessage" placeholder="Message FRED..." autoGrow="true" rows="1"
          (keydown.enter)="$event.preventDefault(); sendMessage()" (ionInput)="onTextareaInput($event)">
        </ion-textarea>
        <!-- pointerdown preventDefault keeps the textarea focused: without it a
             tap first blurs -> keyboard collapses -> layout shifts -> the click
             lands on nothing (or on whatever moved underneath) -->
        <ion-button shape="round" (pointerdown)="$event.preventDefault()" (click)="sendMessage()"
          [disabled]="!newMessage.trim() || isLoading || actionInFlight"
          class="send-button">
          <ion-icon name="arrow-up" slot="icon-only"></ion-icon>
        </ion-button>
      </div>
    </div>
  </ion-footer>
</div>
