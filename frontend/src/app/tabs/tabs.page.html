<!-- init="false": params + event hooks are assigned and initialize() is called
     from TabsPage.initSwiper, outside the Angular zone — see that method. -->
<swiper-container
  #swiper
  class="tabs-swiper"
  init="false"
  (swiperslidechange)="onSlideChange($event)"
  (swipertransitionend)="onTransitionEnd($event)"
>
  <swiper-slide><app-tab1></app-tab1></swiper-slide>
  <swiper-slide><app-tab2></app-tab2></swiper-slide>
  <swiper-slide><app-ai-chat></app-ai-chat></swiper-slide>
  <swiper-slide><app-tab3 class="ion-page"></app-tab3></swiper-slide>
</swiper-container>

<app-floating-tab-bar
  [activeTab]="activeTab()"
  [isSubExpired]="isSubExpired"
  [badge]="settingsTabBadge$ | async"
  (tabSelect)="selectTab($event)"
></app-floating-tab-bar>
